# SonarQube Service
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  type: NodePort
  selector:
    app: sonarqube
  ports:
    - port: 9000        # Port SonarQube listens on inside cluster
      targetPort: 9000  # Container port
      nodePort: 30080   # External access via NodePort

